name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check src tests
      - name: Reproduce a small backtest from the committed snapshot
        run: fxcast backtest --out /tmp/ci --currencies USD --horizons 5 --jobs 2 --min-train 1500 --refit-every 250
